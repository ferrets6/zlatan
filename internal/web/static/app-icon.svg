<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="zlatan">
  <title>zlatan</title>
  <!-- A launcher tile does not follow the system theme, so it commits: the dark
       ground from the palette, the light foreground on top. -->
  <rect width="512" height="512" rx="114" fill="#15161a"/>
  <defs>
    <linearGradient id="zl-google-tile" x1="6.5" y1="0" x2="17.5" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset=".25" stop-color="#4285F4"/><stop offset=".25" stop-color="#EA4335"/>
      <stop offset=".50" stop-color="#EA4335"/><stop offset=".50" stop-color="#FBBC05"/>
      <stop offset=".75" stop-color="#FBBC05"/><stop offset=".75" stop-color="#34A853"/>
    </linearGradient>
  </defs>
  <g transform="translate(43.6 51.1) scale(17.7)">
    <path d="M6.5 7.2 A12.72 12.72 0 0 1 17.5 7.2"
          fill="none" stroke="url(#zl-google-tile)" stroke-width="2" stroke-linecap="round"/>
    <path d="M17.5 7.2 L6.5 17.2 H17.5"
          fill="none" stroke="#e6e6e3" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
